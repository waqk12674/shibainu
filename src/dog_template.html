<!DOCTYPE html>

<style>

   COLOUR and TYPE: 木の床の茶・和紙の札 #fbf4e8／system sans
   LAYOUT: 全画面の3D、上に札のボタン、下に操作の案内 */
html,body{margin:0;height:100%;overflow:hidden;background:#efe8de;font-family:system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;color:#3a2416;touch-action:manipulation;-webkit-user-select:none;user-select:none}

<body>
<canvas id="c"></canvas>
<div id="load">柴犬の毛を並べています…</div>

<div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $ = id => document.getElementById(id);
document.addEventListener('gesturestart', e => e.preventDefault());
const META = __META__;
const bin = Uint8Array.from(atob("__BIN__"), c => c.charCodeAt(0)).buffer;
const P = { shells: 10, shellA: 0.9, shellL: 0.011, strands: 1, minPx: 0.75, w0: 0.000065, spec: 0.6, back: 0.2, opac: 1.0, dpr: 1.5, sun: 1.0 };
const T = { int16: Int16Array, int8: Int8Array, uint16: Uint16Array, uint8: Uint8Array, float32: Float32Array };
const arr = (d) => { const [o, t, sh] = d; return new T[t](bin, o, sh.reduce((a, b) => a * b, 1)); };

const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setClearColor(0xefe8de);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 30);
const LDIR = new THREE.Vector3(-0.7, 0.62, 0.62).normalize();    // 窓からの昼の光
const FDIR = new THREE.Vector3(0.75, 0.6, -0.66).normalize();    // 部屋の照明・壁の照り返し
const U = { uPx: { value: 0.001 }, uMinPx: { value: P.minPx }, uW0: { value: P.w0 }, uL: { value: LDIR }, uF: { value: FDIR }, uSpec: { value: P.spec }, uBack: { value: P.back }, uOpac: { value: P.opac }, uSun: { value: P.sun } };
const PTS = META.pts;

// ---- 毛のリボン
function strandGeo(root, d, os, N, type, cream, ao, dk) {
  const nv = N * PTS * 2, pos = new Float32Array(N * PTS * 3);
  for (let s = 0; s < N; s++) {
    const rx = root[s * 3] * META.rs / 32767, ry = root[s * 3 + 1] * META.rs / 32767, rz = root[s * 3 + 2] * META.rs / 32767;
    pos[s * PTS * 3] = rx; pos[s * PTS * 3 + 1] = ry; pos[s * PTS * 3 + 2] = rz;
    for (let i = 1; i < PTS; i++) { const j = (s * (PTS - 1) + i - 1) * 3, k = (s * PTS + i) * 3; pos[k] = rx + d[j] * os / 127; pos[k + 1] = ry + d[j + 1] * os / 127; pos[k + 2] = rz + d[j + 2] * os / 127; }
  }
  return ribbon(pos, N, type, cream, ao, dk);
}
function ribbon(pos, N, type, cream, ao, dk) {
  const nv = N * PTS * 2;
  const p = new Float32Array(nv * 3), tan = new Int8Array(nv * 4), nrm = new Int8Array(nv * 4), ts = new Float32Array(nv), rt = new Float32Array(nv), kk = new Uint8Array(nv);
  const idx = new Uint32Array(N * (PTS - 1) * 6); let ii = 0;
  for (let s = 0; s < N; s++) {
    const rnd = Math.random(), cr = cream ? cream[s] / 255 : 0, oc = ao ? ao[s] / 255 : 1, kv = dk ? dk[s] : 0;
    const b0 = s * PTS * 3; let nx = pos[b0 + 3] - pos[b0], ny = pos[b0 + 4] - pos[b0 + 1], nz = pos[b0 + 5] - pos[b0 + 2]; const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    for (let i = 0; i < PTS; i++) {
      const k = (s * PTS + i) * 3, a = (s * PTS + Math.max(0, i - 1)) * 3, b = (s * PTS + Math.min(PTS - 1, i + 1)) * 3;
      let tx = pos[b] - pos[a], ty = pos[b + 1] - pos[a + 1], tz = pos[b + 2] - pos[a + 2]; const l = Math.hypot(tx, ty, tz) || 1;
      const t = i / (PTS - 1);
      for (let sd = 0; sd < 2; sd++) {
        const v = (s * PTS + i) * 2 + sd;
        p[v * 3] = pos[k]; p[v * 3 + 1] = pos[k + 1]; p[v * 3 + 2] = pos[k + 2]; kk[v] = kv;
        tan[v * 4] = tx / l * 127; tan[v * 4 + 1] = ty / l * 127; tan[v * 4 + 2] = tz / l * 127;
        nrm[v * 4] = nx * 127; nrm[v * 4 + 1] = ny * 127; nrm[v * 4 + 2] = nz * 127; nrm[v * 4 + 3] = Math.round(oc * 127);
        ts[v] = (t + 0.002) * (sd ? 1 : -1); rt[v] = type * 2 + rnd * 0.999; tan[v * 4 + 3] = Math.round(cr * 127);
      }
      if (i < PTS - 1) { const v0 = (s * PTS + i) * 2; idx[ii++] = v0; idx[ii++] = v0 + 1; idx[ii++] = v0 + 2; idx[ii++] = v0 + 1; idx[ii++] = v0 + 3; idx[ii++] = v0 + 2; }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aTan', new THREE.BufferAttribute(tan, 4, true));
  g.setAttribute('aNrm', new THREE.BufferAttribute(nrm, 4, true));
  g.setAttribute('aTS', new THREE.BufferAttribute(ts, 1));
  g.setAttribute('aRT', new THREE.BufferAttribute(rt, 1));
  g.setAttribute('aK', new THREE.BufferAttribute(kk, 1, true));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.userData.N = N;
  return g;
}
const VS = `
attribute vec4 aTan; attribute vec4 aNrm; attribute float aTS; attribute float aRT; attribute float aK;
uniform float uPx, uMinPx, uW0;
varying vec3 vT, vN, vV; varying float vt, vCov, vRnd, vType, vCream, vY, vAO, vDist, vK;
void main(){
  float side = sign(aTS); vt = abs(aTS) - 0.002;
  vType = floor(aRT / 2.0); vRnd = fract(aRT); vCream = aTan.w;
  vec3 T = normalize(mat3(modelMatrix) * aTan.xyz);
  vec3 N = normalize(mat3(modelMatrix) * aNrm.xyz);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vec3 V = normalize(cameraPosition - wp.xyz);
  vec3 Bv = normalize(cross(T, V) + 1e-5);
  float dist = length(cameraPosition - wp.xyz);
  float w0 = vType > 1.5 ? uW0 * 1.7 : (vType > 0.5 ? uW0 * 0.75 : uW0);
  float wr = mix(w0, w0 * 0.18, vt);
  float w = max(wr, uPx * dist * 0.5 * uMinPx);
  vCov = wr / w;
  wp.xyz += Bv * side * w;
  vT = T; vV = V; vN = N; vY = wp.y; vAO = aNrm.w > 0.0 ? aNrm.w : 1.0; vDist = dist; vK = aK;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const FS = `
precision highp float;
uniform vec3 uL, uF; uniform float uSpec, uBack, uOpac, uSun;
varying vec3 vT, vN, vV; varying float vt, vCov, vRnd, vType, vCream, vY, vAO, vDist, vK;
void main(){
  vec3 T = normalize(vT), V = normalize(vV), N = normalize(vN);
  vec3 cream = vec3(0.93, 0.83, 0.68), red = vec3(0.93, 0.64, 0.37), tip = vec3(0.76, 0.44, 0.20);
  vec3 col; float ao;
  if (vType < 0.5) {
    vec3 rc = mix(mix(vec3(0.95,0.85,0.70), red, smoothstep(0.05, 0.45, vt)), tip, smoothstep(0.75, 1.0, vt) * 0.5);
    vec3 cc = mix(vec3(0.97,0.92,0.86), vec3(0.99, 0.96, 0.90), vt);
    col = mix(rc, cc, vCream);
    ao = mix(0.72, 1.0, smoothstep(0.0, 0.6, vt));
  } else if (vType < 1.5) {
    col = mix(vec3(0.92, 0.76, 0.56), vec3(0.97, 0.93, 0.86), vCream) * (0.84 + 0.16 * vt);
    ao = mix(0.6, 0.95, vt);
  } else {
    col = vec3(0.10, 0.085, 0.075); ao = 1.0;
  }
  col *= 1.0 + (vRnd - 0.5) * mix(0.12, 0.05, vCream);
  col *= mix(1.0, 0.85, smoothstep(0.85, 0.99, N.y) * (1.0 - vCream));
  col *= mix(0.8, 1.0, smoothstep(-0.6, 0.1, N.y));
  float TL = dot(T, uL), TF = dot(T, uF);
  float dif = sqrt(max(0.0, 1.0 - TL*TL)), fil = sqrt(max(0.0, 1.0 - TF*TF));
  float wrapL = clamp(dot(N, uL) * 0.5 + 0.5, 0.0, 1.0), wrapF = clamp(dot(N, uF) * 0.5 + 0.5, 0.0, 1.0);
  vec3 T1 = normalize(T + N * 0.12), T2 = normalize(T - N * 0.18);
  vec3 H = normalize(uL + V), HF = normalize(uF + V);
  float s1 = pow(sqrt(max(0.0, 1.0 - pow(dot(T1, H), 2.0))), 90.0);
  float s2 = pow(sqrt(max(0.0, 1.0 - pow(dot(T2, H), 2.0))), 22.0);
  float s3 = pow(sqrt(max(0.0, 1.0 - pow(dot(T1, HF), 2.0))), 60.0);
  vec3 sunC = vec3(1.0, 0.95, 0.86) * uSun, fillC = vec3(0.92, 0.91, 0.90), amb = vec3(0.80, 0.77, 0.74);
  vec3 c = col * ao * (amb + sunC * dif * wrapL * 0.6 + fillC * fil * wrapF * 0.55);
  c += (sunC * (s1 * 0.35 + s2 * col * 0.5) * wrapL + fillC * s3 * 0.18 * wrapF) * uSpec * ao * (1.0 - 0.8 * vCream) * mix(0.3, 1.0, smoothstep(0.1, 0.5, abs(dot(N, V))));
  float bt = pow(clamp(dot(-V, uL), 0.0, 1.0), 3.0);
  float rim = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 2.0);
  c += sunC * mix(col, vec3(1.0, 0.9, 0.75), 0.3) * (bt * 0.15 + rim * 0.0) * uBack * smoothstep(0.4, 1.0, vt) * (vType > 1.5 ? 0.2 : 1.0);
  c = min(c, col * 1.2 + 0.03);
  c = mix(c * vec3(1.42, 1.36, 1.3), c * vec3(1.24, 1.19, 1.12), vCream) * (vType > 1.5 ? 0.85 : 1.0);
  float aoS = mix(mix(vAO, 1.0, 0.25 * vt), mix(1.0, max(vAO, 0.55), 0.6), vCream);
  c *= mix(mix(0.8, 0.9, vCream), 1.0, smoothstep(0.03, 0.14, vY)) * aoS * mix(vec3(1.0), vec3(1.0, 0.9, 0.78), (1.0 - aoS) * vCream * 2.0);
  c *= mix(mix(0.8, 0.88, vCream), 1.0, clamp(dot(N, uL) * 0.5 + 0.5, 0.0, 1.0));
  c *= mix(1.0, 1.18, vCream);
  c = mix(c, vec3(0.07, 0.055, 0.05), vK * (1.0 - 0.4 * vt));
  float a = vCov * (1.0 - smoothstep(0.6, 1.0, vt) * 0.75) * uOpac * (1.0 - 0.35 * vCream * step(vType, 0.5)) * (vType > 1.5 ? 1.0 : mix(1.0, 0.5, smoothstep(0.8, 1.8, vDist)));
  gl_FragColor = vec4(c, a);
}`;
const strandMat = () => new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, side: THREE.DoubleSide });
const baseMat = new THREE.ShaderMaterial({ uniforms: U, side: THREE.DoubleSide,
  vertexShader: `attribute float aCream; attribute float aAO; attribute float aK; varying float vC, vA, vK; varying vec3 vN; void main(){ vC = aCream; vA = aAO; vK = aK; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uL, uF; varying float vC, vA, vK; varying vec3 vN; void main(){ vec3 N = normalize(vN); float l = clamp(dot(N,uL)*0.5+0.5,0.,1.)*0.5 + clamp(dot(N,uF)*0.5+0.5,0.,1.)*0.5; vec3 c = mix(vec3(0.95,0.64,0.36), vec3(1.0,0.95,0.88), vC); gl_FragColor = vec4(mix(c*(0.75+0.25*l)*mix(vA, 1.0, 0.6*vC), vec3(0.06,0.045,0.04)*(0.7+0.6*l), vK), 1.0); }` });


// ---- 地の毛：短く細かい毛の層（体の面を少しずつふくらませて重ねる）
const SH = { uH: { value: 0 } };
const shellVS = `
attribute float aCream; attribute float aLen; attribute float aAO; attribute float aK;
uniform float uH, uShellL;
varying vec3 vB, vN, vV; varying float vC, vH, vY, vA, vK;
void main(){
  vec3 p = position + normal * uH * uShellL * aLen;
  vec4 w = modelMatrix * vec4(p, 1.0);
  w.y -= uH * uH * uShellL * aLen * 0.35;
  vB = position; vN = normalize(mat3(modelMatrix) * normal); vC = aCream; vH = uH; vY = w.y; vV = normalize(cameraPosition - w.xyz); vA = aAO; vK = aK;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const shellFS = `
precision highp float;
uniform vec3 uL, uF; uniform float uSun, uShellF, uShellA;
varying vec3 vB, vN, vV; varying float vC, vH, vY, vA, vK;
float h31(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
vec3 h33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float fib(vec3 q, float h){ vec3 c=floor(q), f=fract(q); vec3 j=h33(c)*0.6+0.2; float len=0.55+0.45*h31(c+3.1); if(h>len) return 0.0; float r=0.55*(1.0-h/len)+0.08; float d=length(f-j); return 1.0-smoothstep(r*0.55, r, d); }
void main(){
  vec3 q = vB * uShellF;
  float a = max(fib(q, vH), fib(q*1.73+7.3, vH) * 0.85);
  a *= uShellA * (1.0 - vH * 0.6) * smoothstep(0.05, 0.4, abs(dot(normalize(vN), normalize(vV))));
  if (a < 0.03) discard;
  vec3 red = vec3(0.94, 0.68, 0.42), cream = vec3(0.98, 0.94, 0.88);
  vec3 col = mix(red, cream, vC) * mix(mix(0.66, 0.84, vC), 1.03, vH);
  vec3 N = normalize(vN);
  col *= mix(1.0, 0.86, smoothstep(0.85, 0.99, N.y) * (1.0 - vC)) * mix(0.8, 1.0, smoothstep(-0.6, 0.1, N.y));
  float l = 0.78 + 0.22 * (clamp(dot(N,uL)*0.5+0.5,0.,1.)*0.6 + clamp(dot(N,uF)*0.5+0.5,0.,1.)*0.4);
  vec3 oc = col * l * (0.9 + 0.1 * uSun);
  oc = mix(oc * vec3(1.38, 1.32, 1.26), oc * vec3(1.2, 1.15, 1.08), vC) * mix(mix(0.8, 0.9, vC), 1.0, smoothstep(0.03, 0.14, vY)) * mix(mix(vA, 1.0, 0.2 * vH), mix(1.0, vA, 0.4), vC);
  oc *= mix(mix(0.8, 0.88, vC), 1.0, clamp(dot(N, uL) * 0.5 + 0.5, 0.0, 1.0)) * mix(1.0, 1.18, vC);
  oc = mix(oc, vec3(0.07, 0.055, 0.05), vK);
  gl_FragColor = vec4(oc, a);
}`;
const shellU = Object.assign({ uShellL: { value: 0.011 }, uShellF: { value: 1100 }, uShellA: { value: 0.9 } }, U);
const shellMats = [];
function addShells(g, parent, scale) {
  const N = P.shells;
  for (let i = 1; i <= N; i++) {
    const mat = new THREE.ShaderMaterial({ uniforms: Object.assign({ uH: { value: i / N } }, shellU), vertexShader: shellVS, fragmentShader: shellFS, transparent: true, depthWrite: false, side: THREE.FrontSide });
    const m = new THREE.Mesh(g, mat); m.scale.setScalar(scale); m.renderOrder = 2 + i * 0.01; m.frustumCulled = false; parent.add(m); shellMats.push(mat);
  }
}
const earMat = baseMat.clone(); earMat.fragmentShader = earMat.fragmentShader.replace('vec3(0.95,0.92,0.85), vC)', 'vec3(0.72,0.54,0.50), vC)');
const strandGeos = [];
function buildPart(name, parent, mat) {
  const m = META.parts[name];
  const v = arr(m.v), n = arr(m.n), f = arr(m.f);
  const pos = new Float32Array(v.length), nr = new Float32Array(n.length);
  for (let i = 0; i < v.length; i++) { pos[i] = v[i] * META.rs / 32767; nr[i] = n[i] / 127; }
  const vc = arr(m.vc), vcf = new Float32Array(vc.length); for (let i = 0; i < vc.length; i++) vcf[i] = vc[i] / 255;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nr, 3)); g.setAttribute('aCream', new THREE.BufferAttribute(vcf, 1)); g.setIndex(new THREE.BufferAttribute(new Uint16Array(f), 1));
  const vl = arr(m.vl), vlf = new Float32Array(vl.length); for (let i = 0; i < vl.length; i++) vlf[i] = vl[i] / 255 * 2;
  g.setAttribute('aLen', new THREE.BufferAttribute(vlf, 1));
  const va = arr(m.vao), vaf = new Float32Array(va.length); for (let i = 0; i < va.length; i++) vaf[i] = va[i] / 255;
  g.setAttribute('aAO', new THREE.BufferAttribute(vaf, 1));
  g.setAttribute('aK', new THREE.BufferAttribute(m.vk ? arr(m.vk) : new Uint8Array(vaf.length), 1, true));
  const base = new THREE.Mesh(g, mat || baseMat); base.scale.setScalar(0.985); parent.add(base);
  addShells(g, parent, 0.985);
  const ug = strandGeo(arr(m.ur), arr(m.ud), m.uos, m.ur[2][0], 1, arr(m.uc), arr(m.uao), arr(m.uk));
  const gg = strandGeo(arr(m.gr), arr(m.gd), m.gos, m.gr[2][0], 0, arr(m.gc), arr(m.gao), arr(m.gk));
  const um = new THREE.Mesh(ug, strandMat()), gm = new THREE.Mesh(gg, strandMat());
  um.renderOrder = 10; gm.renderOrder = 11; um.frustumCulled = gm.frustumCulled = false;
  parent.add(um, gm); strandGeos.push(ug, gg);
  return { base, ug, gg };
}
const dog = new THREE.Group(); scene.add(dog);
const body = buildPart('body', dog);
const headP = new THREE.Group(); headP.position.fromArray(META.hpos); dog.add(headP);
const head = buildPart('head', headP);
const ears = [];
for (const s of [1, -1]) {
  const eg = new THREE.Group(); const eb = META.ear;
  eg.position.set(eb[0] - META.hp[0], eb[1] - META.hp[1], eb[2] * s);
  eg.scale.z = s; eg.rotation.set(s * META.earRot[0], META.earRot[1], META.earRot[2]);
  headP.add(eg); buildPart('ear', eg, earMat); ears.push(eg);
}
// ひげ
{
  const w = arr(META.whisk), N = META.whisk[2][0];
  const wg = ribbon(new Float32Array(w), N, 2, null); const wm = new THREE.Mesh(wg, strandMat()); wm.renderOrder = 12; wm.frustumCulled = false; headP.add(wm);
}
// 目：大きめの黒目に、光の映り込み
const eyeMat = new THREE.ShaderMaterial({ uniforms: U,
  vertexShader: `varying vec3 vN, vW, vL; void main(){ vN = normalize(mat3(modelMatrix)*normal); vL = normal; vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform vec3 uL, uF; varying vec3 vN, vW, vL; void main(){
    vec3 N = normalize(vN), V = normalize(cameraPosition - vW), R = reflect(-V, N);
